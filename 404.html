<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Página no encontrada | MasseDev
    </title>

    <meta
        name="description"
        content="La página que buscás no existe o fue movida. Volvé al inicio de MasseDev o explorá nuestros servicios."
    >

    <meta name="robots" content="noindex, follow">

    <link
        rel="stylesheet"
        href="./assets/css/main.css"
    >
</head>

<body>

    <a class="skip-link" href="#main-content">
        Saltar al contenido principal
    </a>

    <header class="site-header">

        <div class="container header-container">

            <a
                class="brand"
                href="/"
                aria-label="MasseDev - Inicio"
            >
                <img
                    src="./assets/img/logo/massedev-logo.png"
                    alt="MasseDev - Código de altura"
                    width="220"
                    height="72"
                >
            </a>

        </div>

    </header>


    <main id="main-content">

        <section class="error-page">

            <div class="container error-container">

                <p class="error-code" aria-hidden="true">
                    404
                </p>

                <h1>
                    Esta página tomó otro camino.
                </h1>

                <p>
                    La dirección que buscás no existe,
                    fue movida o ya no está disponible.
                </p>

                <div class="error-actions">

                    <a
                        class="btn btn-primary"
                        href="/"
                    >
                        Volver al inicio
                    </a>

                    <a
                        class="btn btn-secondary"
                        href="/#servicios"
                    >
                        Ver servicios
                    </a>

                </div>

            </div>

        </section>

    </main>

    <script src="./assets/js/main.js"></script>

</body>

</html>
